name: Android build
on:
  push:
    branches: [ 'arena/858e5641-bsohess' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: chess-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
      - name: Report failure details
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/gradle-build.log" ]; then
            grep -E -A 8 '^e: |^\* What went wrong:|^\* Where:|^FAILURE:|^Caused by:' "$RUNNER_TEMP/gradle-build.log" | head -100 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"; line="${line//$'\r'/'%0D'}"; line="${line//$'\n'/'%0A'}"
              echo "::error::$line"
            done
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: chess-app/app/build/outputs/apk/debug/*.apk
